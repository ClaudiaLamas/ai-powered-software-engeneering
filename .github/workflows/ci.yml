# CI da Matriz: lint, build e testes do backend e do frontend, testes E2E de
# browser e, só depois de tudo passar, build das imagens Docker com um teste de
# arranque do compose.yaml. Não usa segredos do repositório: as credenciais da
# base de dados são descartáveis e só existem nos containers do runner, e os
# outros valores são gerados em cada execução.
name: CI

on:
  push:
    paths:
      - "matriz/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "matriz/**"
      - ".github/workflows/ci.yml"

# Permissões mínimas: só ler o código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: matriz

env:
  # Base de dados descartável do serviço postgres de cada job (não é um segredo).
  CI_DATABASE_URL: postgresql://matriz:ci-only-password@localhost:5432/matriz?schema=public

jobs:
  backend:
    name: Backend (lint, build, testes unitários e de API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: matriz
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: matriz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matriz -d matriz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: matriz/backend
    env:
      # O mesmo valor de CI_DATABASE_URL (o env de um job não pode ler o env do workflow).
      DATABASE_URL: postgresql://matriz:ci-only-password@localhost:5432/matriz?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: matriz/.nvmrc
          cache: npm
          cache-dependency-path: matriz/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - name: Testes unitários
        run: npm test
      - name: Testes de API (base matriz_test; JWT_SECRET aleatório no vitest.config.e2e.ts)
        run: npm run test:e2e

  frontend:
    name: Frontend (tipos, build e testes unitários)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: matriz/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: matriz/.nvmrc
          cache: npm
          cache-dependency-path: matriz/frontend/package-lock.json
      - run: npm ci
      - name: Verificação de tipos e build
        run: npm run build
      - name: Testes unitários
        run: npm run test:unit -- --run

  e2e-browser:
    name: Testes E2E de browser (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: matriz
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: matriz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matriz -d matriz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: matriz/.nvmrc
          cache: npm
          cache-dependency-path: |
            matriz/backend/package-lock.json
            matriz/frontend/package-lock.json
      - name: Dependências e cliente Prisma do backend
        working-directory: matriz/backend
        run: npm ci && npx prisma generate
      - name: backend/.env só com DATABASE_URL (o playwright.config.ts deriva dele a base matriz_e2e_test)
        working-directory: matriz/backend
        run: echo "DATABASE_URL=$CI_DATABASE_URL" > .env
      - name: Palavra-passe aleatória das contas de demonstração
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Dependências do frontend e Chromium
        working-directory: matriz/frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Testes E2E
        working-directory: matriz/frontend
        run: npm run test:e2e
      - name: Traces e capturas em caso de falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: matriz/frontend/test-results/
          retention-days: 7

  docker:
    name: Imagens Docker e arranque com Docker Compose
    # Só avança depois de todas as verificações passarem.
    needs: [backend, frontend, e2e-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .env com valores gerados nesta execução
        run: |
          pg_password="$(openssl rand -hex 16)"
          jwt_secret="$(openssl rand -hex 32)"
          seed_password="$(openssl rand -hex 16)"
          echo "::add-mask::$pg_password"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$seed_password"
          {
            echo "POSTGRES_USER=matriz"
            echo "POSTGRES_PASSWORD=$pg_password"
            echo "POSTGRES_DB=matriz"
            echo "POSTGRES_PORT=5432"
            echo "FRONTEND_PORT=8080"
            echo "JWT_SECRET=$jwt_secret"
            echo "SEED_DEMO_PASSWORD=$seed_password"
          } > .env
      - run: docker compose config -q
      - run: docker compose build
      - name: Arranque (migrations, backend e frontend)
        run: docker compose up -d
      - name: Aplicação acessível pelo frontend (nginx → backend → PostgreSQL)
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS http://localhost:8080/api/health | grep -q '"database":"up"'
          docker compose ps
      - name: Seed e entrada com uma conta de demonstração
        run: |
          docker compose run --rm migrate npm run db:seed
          password="$(grep '^SEED_DEMO_PASSWORD=' .env | cut -d= -f2-)"
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"ana.silva@matriz.test\",\"password\":\"$password\"}")"
          echo "POST /api/auth/login → $status"
          test "$status" = 200
      - name: Logs dos serviços
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Parar e apagar os containers e o volume
        if: always()
        run: docker compose down -v
