# nginx do frontend da Matriz (container). Faz o mesmo que o proxy do Vite em
# desenvolvimento (vite.config.ts): /api/... vai para o backend sem o prefixo
# /api, por isso o backend não precisa de CORS. O resto é a SPA (dist/).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Resolver interno do Docker: o endereço do serviço "backend" é resolvido
    # em cada pedido, e o nginx arranca mesmo que o backend ainda não exista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ficheiros com hash no nome (Vite): podem ficar em cache.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rotas da SPA (createWebHistory): qualquer outro caminho devolve o index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
