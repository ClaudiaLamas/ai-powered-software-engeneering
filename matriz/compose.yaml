# Execução local da Matriz (D05). O Mailpit (D09) entra no incremento 2.
# Copia .env.example para .env antes de arrancar: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: matriz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A partir do PostgreSQL 18 o volume monta-se em /var/lib/postgresql.
      - matriz_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  matriz_pgdata:
